<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 48" width="100" height="48" fill="none">
  <defs>
    <linearGradient id="scaleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#4f6fff"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00d4ff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- LADO IZQUIERDO: Balanza de la Justicia (Asesoría Jurídica) -->
  <g id="balanza" transform="translate(4, 8)" filter="url(#iconGlow)">
    <!-- Base -->
    <path d="M7 28 H21" stroke="url(#scaleGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Poste central -->
    <path d="M14 6 V28" stroke="url(#scaleGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Pomo superior -->
    <circle cx="14" cy="5" r="2" fill="#00d4ff"/>
    <!-- Brazo oscilante -->
    <path d="M4 10 H24" stroke="url(#scaleGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Platillo izquierdo -->
    <path d="M5 10 L2 18 H8 Z" stroke="url(#scaleGrad)" stroke-width="1.2" fill="rgba(79,111,255,0.2)"/>
    <!-- Platillo derecho -->
    <path d="M23 10 L20 18 H26 Z" stroke="url(#scaleGrad)" stroke-width="1.2" fill="rgba(79,111,255,0.2)"/>
  </g>

  <!-- CENTRO: Flechas curvas apuntándose mutuamente (Combinación / Fusión Dinámica) -->
  <g id="flechas-combinacion" transform="translate(36, 10)">
    <!-- Flecha superior (curva de izquierda a derecha) -->
    <path d="M3 8 C12 0, 20 4, 25 10" stroke="url(#arrowGrad)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <polygon points="25,5 28,12 21,11" fill="#00d4ff"/>

    <!-- Flecha inferior (curva de derecha a izquierda) -->
    <path d="M25 20 C16 28, 8 24, 3 18" stroke="url(#arrowGrad)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <polygon points="3,23 0,16 7,17" fill="#a78bfa"/>
  </g>

  <!-- LADO DERECHO: Carrito de Supermercado (Comercio / Tienda) -->
  <g id="carrito" transform="translate(68, 10)">
    <!-- Estructura del carrito -->
    <path d="M1 4 H6 L10 20 H23 L26 8 H8" stroke="url(#cartGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Rejilla interior -->
    <line x1="14" y1="11" x2="14" y2="17" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="19" y1="11" x2="19" y2="17" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Ruedas -->
    <circle cx="12" cy="24" r="2.2" fill="#e8e8ff"/>
    <circle cx="21" cy="24" r="2.2" fill="#e8e8ff"/>
  </g>
</svg>
