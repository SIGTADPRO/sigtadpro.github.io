<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 38" width="110" height="38" fill="none">
  <!-- Degradados para nitidez sin filtros de desenfoque -->
  <defs>
    <linearGradient id="balanzaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="flechasGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="carritoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- 1. BALANZA DE LA JUSTICIA (Área Jurídica) -->
  <g id="balanza-juridica">
    <!-- Base y pedestal -->
    <path d="M8 32 H24" stroke="url(#balanzaGrad)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M16 8 V32" stroke="url(#balanzaGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Pomo superior central -->
    <circle cx="16" cy="7" r="2.2" fill="#38bdf8"/>
    <!-- Brazo transversal -->
    <path d="M5 12 C10 10.5, 22 10.5, 27 12" stroke="url(#balanzaGrad)" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Platillo izquierdo -->
    <line x1="6" y1="12" x2="3" y2="21" stroke="#38bdf8" stroke-width="1.3"/>
    <line x1="6" y1="12" x2="9" y2="21" stroke="#38bdf8" stroke-width="1.3"/>
    <path d="M2 21 Q6 25 10 21 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.3"/>

    <!-- Platillo derecho -->
    <line x1="26" y1="12" x2="23" y2="21" stroke="#38bdf8" stroke-width="1.3"/>
    <line x1="26" y1="12" x2="29" y2="21" stroke="#38bdf8" stroke-width="1.3"/>
    <path d="M22 21 Q26 25 30 21 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.3"/>
  </g>

  <!-- 2. FLECHAS DE COMBINACIÓN / INTEGRACIÓN MUTUA -->
  <g id="flechas-sinergia">
    <!-- Flecha curva superior (izq a der) -->
    <path d="M37 13 C47 7, 59 7, 69 12" stroke="url(#flechasGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <polygon points="69,8 74,13 67,16" fill="#a855f7"/>

    <!-- Flecha curva inferior (der a izq) -->
    <path d="M69 25 C59 31, 47 31, 37 26" stroke="url(#flechasGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <polygon points="37,30 32,25 39,22" fill="#38bdf8"/>
  </g>

  <!-- 3. CARRITO DE SUPERMERCADO (Comercio / Negocio) -->
  <g id="carrito-comercial">
    <!-- Estructura del carrito -->
    <path d="M79 8 H83 L86 23 H100 L103 11 H85" stroke="url(#carritoGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Rejillas del carrito -->
    <line x1="91" y1="14" x2="91" y2="20" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="96" y1="14" x2="96" y2="20" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Ruedas -->
    <circle cx="88" cy="28" r="2.2" fill="#38bdf8"/>
    <circle cx="98" cy="28" r="2.2" fill="#38bdf8"/>
  </g>
</svg>
