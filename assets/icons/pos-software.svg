<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="posGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#4f6fff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="posGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00d4ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Pantalla POS / Computadora de Control -->
  <g filter="url(#posGlow)">
    <!-- Monitor principal -->
    <rect x="4" y="6" width="40" height="26" rx="4" fill="#0d0d28" stroke="url(#posGrad)" stroke-width="2.2"/>
    <!-- Barra superior de ventana -->
    <line x1="4" y1="12" x2="44" y2="12" stroke="rgba(79,111,255,0.4)" stroke-width="1.5"/>
    <circle cx="8" cy="9" r="1.2" fill="#ef4444"/>
    <circle cx="12" cy="9" r="1.2" fill="#fbbf24"/>
    <circle cx="16" cy="9" r="1.2" fill="#10b981"/>

    <!-- Gráfica / métricas de caja dentro de la pantalla -->
    <path d="M10 26 L18 19 L26 23 L36 15" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="36" cy="15" r="2" fill="#00d4ff"/>
    <!-- Columnas de caja -->
    <rect x="11" y="24" width="3" height="4" fill="rgba(79,111,255,0.5)"/>
    <rect x="17" y="20" width="3" height="8" fill="rgba(79,111,255,0.5)"/>
    <rect x="25" y="23" width="3" height="5" fill="rgba(79,111,255,0.5)"/>
    <rect x="33" y="16" width="3" height="12" fill="rgba(0,212,255,0.7)"/>

    <!-- Base y pedestal -->
    <path d="M20 32 L18 39 H30 L28 32" fill="#161640" stroke="url(#posGrad)" stroke-width="1.8"/>
    <!-- Cajón de dinero inferior -->
    <rect x="8" y="39" width="32" height="5" rx="1.5" fill="#111130" stroke="url(#posGrad)" stroke-width="1.8"/>
    <line x1="22" y1="41.5" x2="26" y2="41.5" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
